notes: >-
  Wyze operates a public security/trust hub rather than a vendor trust portal (no
  SafeBase/Vanta-style document request flow, no downloadable audit reports). It names
  device- and app-level certifications and third-party testing rather than enterprise
  attestations. IMPORTANT ATTRIBUTION: the page cites "Using AWS infrastructure (SOC2 &
