aid: wyze
name: Wyze
description: 'Wyze Labs, Inc. is a Kirkland, Washington consumer smart-home company
  founded in 2017 by former Amazon employees, known for value-priced connected hardware:
  indoor and outdoor security cameras, video doorbells, smart locks, contact and motion
  sensors, plugs, bulbs and light strips, robot vacuums, thermostats, sprinkler controllers,
  scales and wearables. Devices are operated through the Wyze app and backed by cloud
  services sold as subscriptions (Cam Plus, Cam Unlimited, Wyze Home Monitoring). Wyze
  does not publish a general-purpose public developer platform, but it does operate a
  first-party Developer API Console at developer-api-console.wyze.com that issues a
  personal API Key / Key ID pair so owners can authenticate against the Wyze cloud API
  (auth-prod.api.wyze.com and api.wyzecam.com) from Home Assistant, Homebridge and other
  third-party integrations. Its Shopify-hosted storefront additionally exposes agent-facing
  commerce surfaces: a published llms.txt/agents.md, a Universal Commerce Protocol (UCP)
  discovery document, and two live Model Context Protocol servers.'
