apis:
- aid: wyze:developer-api
  name: Wyze Developer API
  description: 'The first-party Wyze cloud API reached with a personal API Key and Key
    ID generated from the Wyze Developer API Console. Authentication posts credentials
    to auth-prod.api.wyze.com to exchange the key pair for an access token (valid 2 days)
    and refresh token (valid 30 days), which are then used against the api.wyzecam.com
    application endpoints that back the Wyze app. Wyze publishes the key-issuance and
    login/refresh flow in its support documentation but does not publish a full endpoint
    reference or a machine-readable OpenAPI description.'
  humanURL: https://support.wyze.com/hc/en-us/articles/16129834216731-Creating-an-API-Key
  baseURL: https://api.wyzecam.com
  tags:
  - Smart Home
  - Internet of Things
  - Devices
  - Authentication
  properties:
  - type: Documentation
    url: https://support.wyze.com/hc/en-us/articles/16129834216731-Creating-an-API-Key
  - type: DeveloperPortal
    url: https://developer-api-console.wyze.com/
  - type: Authentication
    url: authentication/wyze-authentication.yml
- aid: wyze:storefront-mcp
  name: Wyze Storefront MCP Server
  description: 'A live, anonymously reachable Model Context Protocol server on the Wyze
    storefront host that lets agents search the Wyze product catalog, read and update a
    cart, look up product detail, and query store policies and FAQs. The tool list and
    per-tool JSON input schemas were returned by an unauthenticated MCP tools/list call
    and are captured verbatim in mcp/.'
  humanURL: https://www.wyze.com/llms.txt
  baseURL: https://www.wyze.com/api/mcp
  tags:
  - MCP
  - Commerce
  - Agents
  tags_raw:
  - Model Context Protocol
  - Commerce
  - Agents
  properties:
  - type: MCPServer
    url: mcp/wyze-mcp.yml
  - type: LLMsTxt
    url: llms/wyze-llms.txt
- aid: wyze:customer-account-mcp
  name: Wyze Customer Account MCP Server
  description: 'A live Model Context Protocol server on account.wyze.com exposing customer
    order-status lookup, store-credit balances and return requests. tools/list answers
    anonymously; the tools themselves operate on a logged-in customer session. The tool
    list and input schemas are captured verbatim in mcp/.'
  humanURL: https://www.wyze.com/llms.txt
  baseURL: https://account.wyze.com/customer/api/mcp
  tags:
  - MCP
  - Commerce
  - Order
  tags_raw:
  - Model Context Protocol
  - Commerce
  - Orders
  properties:
  - type: MCPServer
    url: mcp/wyze-mcp.yml
- aid: wyze:ucp
  name: Wyze UCP Commerce Endpoint
  description: 'The Universal Commerce Protocol (UCP) merchant surface published by the
    Wyze storefront. The /.well-known/ucp discovery document declares supported UCP
    versions, the dev.ucp.shopping MCP service endpoint, cart/checkout/fulfillment/discount/
    catalog capabilities and the Google Pay, Shopify Card and Shop Pay payment handlers.
    The UCP MCP endpoint itself rejects anonymous tools/list with a required agent-profile
    error, so its tool schemas are gated; the tool names are the ones published in
    llms.txt.'
  humanURL: https://www.wyze.com/llms.txt
  baseURL: https://www.wyze.com/api/ucp/mcp
  tags:
  - Commerce
  - Agents
  - Universal Commerce Protocol
  properties:
  - type: WellKnown
    url: well-known/wyze-ucp.json
