notes: >-
  Wyze runs its developer surface as a support-documented capability rather than a
  versioned developer platform. There is no published API version scheme, no deprecation
  policy, no Sunset/Deprecation header support documented, and no SLA. What Wyze does
  publish is a maintained Service Status & Known Issues page and a set of credential
  lifetimes. Everything below is observed or published - nothing is inferred from a spec,
  because Wyze publishes no OpenAPI.
versioning:
  scheme: uri-path
  observed_prefixes:
  - /api/ on auth-prod.api.wyze.com
  - /app/ and /app/v2/ on api.wyzecam.com
  current: unversioned/undeclared
  policy_published: false
  docs: null
deprecation:
  policy_url: null
  policy_published: false
  sunset_header: false
  deprecation_header: false
  note: >-
    No RFC 8594 Sunset or Deprecation header support is documented, and no deprecation
    policy page exists. Wyze has historically retired device services (for example
    original Wyze Cam v1 cloud support) through support announcements and email rather
    than an API deprecation policy.
