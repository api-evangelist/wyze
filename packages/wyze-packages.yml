summary: >-
  Wyze publishes NO first-party client library in any package registry. The verified
  GitHub organization github.com/wyzelabs-inc exists and controls wyze.com but has zero
  public repositories. Every client library below is community-maintained and is recorded
  with official: false. Because no official SDK exists, this repo deliberately does NOT
  carry an `SDKs` pointer in apis.yml - that would misrepresent Wyze's developer surface.
